<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="active-card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="active-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F0F6FC; }
    .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #38BDF8; letter-spacing: 0.5px; }
    .text-date { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #8B949E; }
    .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #C9D1D9; line-height: 1.4; }
    .text-tech { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #7DD3FC; }

    .node-past { fill: #0D1117; stroke: #38BDF8; stroke-width: 2.5; }
    .node-active { fill: #0284C7; stroke: #38BDF8; stroke-width: 3; filter: url(#active-glow); animation: pulse 2.5s infinite alternate ease-in-out; }
    .node-future { fill: #0D1117; stroke: #64748B; stroke-width: 2; stroke-dasharray: 3 3; }

    @keyframes pulse {
      0% { r: 9; opacity: 0.85; filter: drop-shadow(0 0 4px #38BDF8); }
      100% { r: 11; opacity: 1; filter: drop-shadow(0 0 12px #38BDF8); }
    }

    @keyframes flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-spine {
      stroke-dasharray: 8 8;
      animation: flow 3s linear infinite;
    }
  </style>

  <!-- Container Outer Card -->
  <rect width="850" height="1480" rx="16" fill="url(#bg-grad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Section Header Inside SVG -->
  <text x="45" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#F0F6FC" letter-spacing="-0.3">Timeline</text>
  <text x="45" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#8B949E">Key System Milestones &amp; Technical Growth</text>

  <!-- Vertical Timeline Spine -->
  <line x1="90" y1="120" x2="90" y2="1280" stroke="url(#spine-grad)" stroke-width="3" />
  <line x1="90" y1="1280" x2="90" y2="1410" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Animated flow accent -->
  <line x1="90" y1="120" x2="90" y2="1280" stroke="#7DD3FC" stroke-width="2" opacity="0.6" class="animated-spine" />


  <!-- ITEM 1: Game Boy Emulator (2024) -->
  <g transform="translate(0, 110)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">Game Boy Emulator</text>
    <rect x="360" y="14" width="230" height="24" rx="12" fill="#0C4A6E" />
    <text x="375" y="30" class="text-subtitle">SOFTWARE ARCHITECTURE</text>
    <text x="730" y="31" class="text-date">LATE 2024</text>
    <text x="155" y="58" class="text-body">Mastered object-oriented programming principles, encapsulation, and persistent state profiling.</text>
    <rect x="155" y="68" width="55" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">C++</text>
    <rect x="218" y="68" width="50" height="18" rx="4" fill="#1E293B" />
    <text x="228" y="81" class="text-tech">OOP</text>
  </g>


  <!-- ITEM 2: Xonix Engine (2025) -->
  <g transform="translate(0, 240)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">Xonix Game Engine</text>
    <rect x="360" y="14" width="255" height="24" rx="12" fill="#0C4A6E" />
    <text x="375" y="30" class="text-subtitle">ADVANCED DATA STRUCTURES</text>
    <text x="735" y="31" class="text-date">MID 2025</text>
    <text x="155" y="58" class="text-body">Implemented Min-Heap leaderboards, priority queues, hash-table social graphs, and AVL trees.</text>
    <rect x="155" y="68" width="55" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">C++</text>
    <rect x="218" y="68" width="90" height="18" rx="4" fill="#1E293B" />
    <text x="228" y="81" class="text-tech">AVL &amp; Heaps</text>
  </g>


  <!-- ITEM 3: CureShare (Early 2026) -->
  <g transform="translate(0, 370)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">CureShare Medicine System</text>
    <rect x="390" y="14" width="160" height="24" rx="12" fill="#0C4A6E" />
    <text x="405" y="30" class="text-subtitle">SYSTEM DESIGN</text>
    <text x="715" y="31" class="text-date">EARLY 2026</text>
    <text x="155" y="58" class="text-body">Multi-role desktop platform with FIFO allocation logic, inventory alerts, and analytics dashboards.</text>
    <rect x="155" y="68" width="55" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">Java</text>
    <rect x="218" y="68" width="115" height="18" rx="4" fill="#1E293B" />
    <text x="228" y="81" class="text-tech">Desktop Systems</text>
  </g>


  <!-- ITEM 4: Warehouse Optimization (Feb 2026) -->
  <g transform="translate(0, 500)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">Warehouse Optimization</text>
    <rect x="370" y="14" width="235" height="24" rx="12" fill="#0C4A6E" />
    <text x="385" y="30" class="text-subtitle">EVOLUTIONARY COMPUTING</text>
    <text x="730" y="31" class="text-date">FEB 2026</text>
    <text x="155" y="58" class="text-body">Applied genetic algorithms (selection, crossover, mutation) for distance minimization and fitness analysis.</text>
    <rect x="155" y="68" width="65" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">Python</text>
    <rect x="228" y="68" width="125" height="18" rx="4" fill="#1E293B" />
    <text x="238" y="81" class="text-tech">Genetic Algorithms</text>
  </g>


  <!-- ITEM 5: Stochastic Battlefield (Mar 2026) -->
  <g transform="translate(0, 630)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">Stochastic Battlefield</text>
    <rect x="340" y="14" width="115" height="24" rx="12" fill="#0C4A6E" />
    <text x="355" y="30" class="text-subtitle">GAME AI</text>
    <text x="725" y="31" class="text-date">MAR 2026</text>
    <text x="155" y="58" class="text-body">Designed multi-agent stochastic decision models using Expectiminimax and Alpha-Beta pruning.</text>
    <rect x="155" y="68" width="65" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">Python</text>
    <rect x="228" y="68" width="115" height="18" rx="4" fill="#1E293B" />
    <text x="238" y="81" class="text-tech">Expectiminimax</text>
    <rect x="351" y="68" width="95" height="18" rx="4" fill="#1E293B" />
    <text x="361" y="81" class="text-tech">DearPyGui</text>
  </g>


  <!-- ITEM 6: Quiz Generation System (Apr 2026) -->
  <g transform="translate(0, 760)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">Quiz Generation System</text>
    <rect x="360" y="14" width="275" height="24" rx="12" fill="#0C4A6E" />
    <text x="375" y="30" class="text-subtitle">CLASSICAL MACHINE LEARNING</text>
    <text x="725" y="31" class="text-date">APR 2026</text>
    <text x="155" y="58" class="text-body">Trained Logistic Regression and SVM on RACE dataset TF-IDF vectors with cosine similarity distractors.</text>
    <rect x="155" y="68" width="65" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">Python</text>
    <rect x="228" y="68" width="90" height="18" rx="4" fill="#1E293B" />
    <text x="238" y="81" class="text-tech">scikit-learn</text>
    <rect x="326" y="68" width="75" height="18" rx="4" fill="#1E293B" />
    <text x="336" y="81" class="text-tech">Streamlit</text>
  </g>


  <!-- ITEM 7: VoiceFlow AI (Jun 2026) -->
  <g transform="translate(0, 890)">
    <circle cx="90" cy="35" r="7" class="node-past" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <text x="155" y="32" class="text-title">VoiceFlow AI</text>
    <rect x="280" y="14" width="230" height="24" rx="12" fill="#0C4A6E" />
    <text x="295" y="30" class="text-subtitle">REAL-TIME SPEECH &amp; NLP</text>
    <text x="725" y="31" class="text-date">JUN 2026</text>
    <text x="155" y="58" class="text-body">Real-time speech-to-speech translation pipeline integrating Web Speech ASR, NLP translation, and gTTS.</text>
    <rect x="155" y="68" width="65" height="18" rx="4" fill="#1E293B" />
    <text x="167" y="81" class="text-tech">Python</text>
    <rect x="228" y="68" width="55" height="18" rx="4" fill="#1E293B" />
    <text x="238" y="81" class="text-tech">Flask</text>
    <rect x="291" y="68" width="115" height="18" rx="4" fill="#1E293B" />
    <text x="301" y="81" class="text-tech">Web Speech ASR</text>
    <rect x="414" y="68" width="55" height="18" rx="4" fill="#1E293B" />
    <text x="424" y="81" class="text-tech">gTTS</text>
  </g>


  <!-- ITEM 8: ResumeIQ (Jul 2026 - HIGHLIGHTED ACTIVE) -->
  <g transform="translate(0, 1020)">
    <circle cx="90" cy="35" r="9" class="node-active" />
    <rect x="130" y="5" width="670" height="98" rx="10" fill="url(#active-card-grad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow)" />
    <text x="155" y="32" class="text-title" font-size="17" fill="#7DD3FC">ResumeIQ System</text>
    <rect x="330" y="14" width="245" height="24" rx="12" fill="#0284C7" />
    <text x="345" y="30" class="text-subtitle" fill="#FFFFFF">SEMANTIC ML ENGINEERING</text>
    <text x="705" y="31" class="text-date" fill="#7DD3FC" font-weight="700">ACTIVE PROJECT</text>
    <text x="155" y="58" class="text-body" fill="#E0F2FE">End-to-end resume scoring, feature engineering schema design, and semantic document matching.</text>
    <rect x="155" y="68" width="65" height="18" rx="4" fill="#0C4A6E" />
    <text x="167" y="81" class="text-tech" fill="#E0F2FE">Python</text>
    <rect x="228" y="68" width="65" height="18" rx="4" fill="#0C4A6E" />
    <text x="238" y="81" class="text-tech" fill="#E0F2FE">PyTorch</text>
    <rect x="301" y="68" width="135" height="18" rx="4" fill="#0C4A6E" />
    <text x="311" y="81" class="text-tech" fill="#E0F2FE">Feature Engineering</text>
  </g>


  <!-- ITEM 9: Next Horizon (Future Focus) -->
  <g transform="translate(0, 1160)">
    <circle cx="90" cy="35" r="7" class="node-future" />
    <rect x="130" y="5" width="670" height="95" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="155" y="32" class="text-title" fill="#94A3B8">Next Horizon: Production AI</text>
    <rect x="390" y="14" width="170" height="24" rx="12" fill="#1E293B" />
    <text x="405" y="30" class="text-subtitle" fill="#94A3B8">FUTURE ROADMAP</text>
    <text x="715" y="31" class="text-date" fill="#64748B">2026 &amp; BEYOND</text>
    <text x="155" y="58" class="text-body" fill="#94A3B8">Deepening focus on Large Language Models, RAG system design, and production MLOps pipelines.</text>
    <rect x="155" y="68" width="95" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="165" y="81" class="text-tech" fill="#94A3B8">Transformers</text>
    <rect x="258" y="68" width="115" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="268" y="81" class="text-tech" fill="#94A3B8">RAG Architectures</text>
    <rect x="381" y="68" width="95" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="391" y="81" class="text-tech" fill="#94A3B8">LLM Agents</text>
    <rect x="484" y="68" width="65" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="494" y="81" class="text-tech" fill="#94A3B8">MLOps</text>
  </g>

</svg>
