<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="vf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="block-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow-vf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .label-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #F0F6FC; }
    .label-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #94A3B8; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #38BDF8; }
    
    @keyframes pulseLine {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line { stroke-dasharray: 6 6; animation: pulseLine 2s linear infinite; }
  </style>

  <!-- Container -->
  <rect width="800" height="240" rx="12" fill="url(#vf-bg)" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#38BDF8" letter-spacing="0.5">VOICEFLOW AI ARCHITECTURE PIPELINE</text>

  <!-- Pipeline Nodes -->

  <!-- Node 1: Web Speech ASR -->
  <g transform="translate(30, 65)">
    <rect width="155" height="130" rx="10" fill="url(#block-grad)" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#0C4A6E" />
    <path d="M30 22v12M25 26v4M35 25v6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <text x="30" y="72" class="label-title">Audio Input</text>
    <text x="30" y="92" class="label-sub">Web Speech ASR</text>
    <text x="30" y="110" class="node-text">Live Voice</text>
  </g>

  <!-- Connector 1 -->
  <path d="M185 130 h35" stroke="#38BDF8" stroke-width="2" class="flow-line" />
  <polygon points="220,130 212,125 212,135" fill="#38BDF8" />

  <!-- Node 2: Flask NLP Server -->
  <g transform="translate(225, 65)">
    <rect width="170" height="130" rx="10" fill="url(#block-grad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow-vf)" />
    <circle cx="30" cy="30" r="14" fill="#0369A1" />
    <path d="M23 30h14M30 23v14" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" />
    <text x="30" y="72" class="label-title">NLP Engine</text>
    <text x="30" y="92" class="label-sub">Flask Translation</text>
    <text x="30" y="110" class="node-text">Context Parsing</text>
  </g>

  <!-- Connector 2 -->
  <path d="M395 130 h35" stroke="#38BDF8" stroke-width="2" class="flow-line" />
  <polygon points="430,130 422,125 422,135" fill="#38BDF8" />

  <!-- Node 3: Neural Speech Synthesis -->
  <g transform="translate(435, 65)">
    <rect width="165" height="130" rx="10" fill="url(#block-grad)" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#0C4A6E" />
    <path d="M24 30h12M32 24l4 6-4 6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <text x="30" y="72" class="label-title">Neural TTS</text>
    <text x="30" y="92" class="label-sub">gTTS Synthesis</text>
    <text x="30" y="110" class="node-text">Target Audio</text>
  </g>

  <!-- Connector 3 -->
  <path d="M600 130 h35" stroke="#38BDF8" stroke-width="2" class="flow-line" />
  <polygon points="635,130 627,125 627,135" fill="#38BDF8" />

  <!-- Node 4: Spoken Output -->
  <g transform="translate(640, 65)">
    <rect width="130" height="130" rx="10" fill="url(#block-grad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#1E293B" />
    <path d="M25 30l10-7v14z" fill="#38BDF8" />
    <text x="30" y="72" class="label-title">Audio Out</text>
    <text x="30" y="92" class="label-sub">Real-Time</text>
    <text x="30" y="110" class="node-text">Playback</text>
  </g>
</svg>
